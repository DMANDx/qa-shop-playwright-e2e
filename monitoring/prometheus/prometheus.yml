global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: qa-shop
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: qa-shop

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
