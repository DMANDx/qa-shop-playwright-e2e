<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>QA Shop — Grafana</title>
</head>
<body>
  <p>Открываем дашборд Grafana… <a id="grafana-link" href="#">Открыть вручную</a></p>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://clear-hawk-4cbfc467.tunnl.gg/d/qa-shop-overview/qa-shop-e28094-obzor">
  </noscript>
  <script>
    (function () {
      var path = '/d/qa-shop-overview/qa-shop-e28094-obzor?orgId=1&from=now-1h&to=now&timezone=browser&refresh=1m';
      var fallback = 'https://clear-hawk-4cbfc467.tunnl.gg';
      var finished = false;

      function open(base) {
        var url = String(base || fallback).replace(/\/+$/, '') + path;
        document.getElementById('grafana-link').href = url;
        window.location.replace(url);
      }

      function finish(base) {
        if (!finished) {
          finished = true;
          open(base);
        }
      }

      setTimeout(function () { finish(fallback); }, 6000);

      fetch('/qa-shop-playwright-e2e/tunnel.json?ts=' + Date.now(), { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) { throw new Error('manifest unavailable'); }
          return response.json();
        })
        .then(function (manifest) { finish(manifest.url); })
        .catch(function () { finish(fallback); });
    })();
  </script>
</body>
</html>
